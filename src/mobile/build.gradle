plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ilusons.harmony'
    compileSdk 36

    defaultConfig {
        applicationId "com.ilusons.harmony"
        minSdk 26
        targetSdk 36
        versionCode Integer.parseInt(project.findProperty('versionCode') ?: '100010003')
        versionName (project.findProperty('version') ?: '1.2.0')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
    }

    buildTypes {
        debug {
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            versionNameSuffix '-release'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            def lastfm = file('../../res/libs/lastfm-java/src/main/java')
            if (lastfm.exists()) java.srcDirs += lastfm

            java.exclude '**/FCMService.java'
            java.exclude '**/OpenSLMediaPlayerFactory.java'
            java.exclude '**/AudioTrackMediaPlayerFactory.java'
            java.exclude '**/AndroidOSMediaPlayerFactory.java'
            java.exclude '**/vending/**'
            java.exclude '**/RealmEx.java'

            java.exclude '**/VisualizerEx.java'
        }
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES.txt',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE.txt',
                    'META-INF/NOTICE',
                    'META-INF/LICENSE',
                    'META-INF/DEPENDENCIES',
                    'META-INF/LGPL2.1'
            ]
        }
    }

    lint {
        abortOnError false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.work:work-runtime:2.10.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'androidx.media3:media3-common:1.5.1'

    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    implementation 'com.facebook.fresco:fresco:2.6.0'
    implementation 'org.jsoup:jsoup:1.18.1'
    implementation 'org.apache.commons:commons-text:1.12.0'
    implementation 'org.apache.commons:commons-lang3:3.17.0'
    implementation 'commons-io:commons-io:2.16.1'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.tozny:java-aes-crypto:1.1.0'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'

    implementation 'com.airbnb.android:lottie:6.6.2'
    implementation 'me.tankery.lib:circularSeekBar:1.4.1'
    implementation 'jp.wasabeef:blurry:4.0.1'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.jonathanfinerty.once:once:1.3.1'
    implementation 'io.github.dreierf:material-intro-screen:0.0.6'
    implementation 'com.h6ah4i.android.widget.advrecyclerview:advrecyclerview:1.0.0'
    implementation 'com.h6ah4i.android.widget.verticalseekbar:verticalseekbar:1.0.0'

    testImplementation 'junit:junit:4.13.2'
}
