name: Android CI

on:
  push:
    branches:
      - modernize/android-36
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: src
        run: |
          chmod +x ./gradlew
          ./gradlew :mobile:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: harmony-debug
          path: src/mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/modernize/android-36'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-36-preview
          name: Android 16 preview
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: src/mobile/build/outputs/apk/debug/mobile-debug.apk
          body: |
            Sideload preview of Harmony targeting Android 16 (API 36).

            Install `mobile-debug.apk`, grant **Music and audio** (and notifications if asked), then play a local track.

            This prerelease is overwritten on every push to `modernize/android-36`.
